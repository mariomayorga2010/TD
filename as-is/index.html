<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama de flujo AS-IS · Solicitud y recepción de servicios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__title">
    <span class="topbar__eyebrow">Proceso AS-IS</span>
    <h1>Solicitud, recepción y pago de servicios</h1>
  </div>

  <div class="legend">
    <span class="legend__item"><i class="ico ico--task"></i>Tarea</span>
    <span class="legend__item"><i class="ico ico--decision"></i>Decisión</span>
    <span class="legend__item"><i class="ico ico--start"></i>Inicio / Fin</span>
    <span class="legend__item"><i class="ico ico--loop"></i>Retorno (No)</span>
  </div>
</header>

<div class="canvas-wrap">
  <div class="canvas-scroll" id="canvasScroll">
    <div class="canvas" id="canvas">
      <svg class="canvas__svg" id="edges" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1E5FE0"></path>
          </marker>
          <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#C24A3D"></path>
          </marker>
        </defs>
      </svg>
      <!-- lane labels, phase headers y nodos se inyectan por JS -->
    </div>
  </div>
  <div class="canvas-hint">Desliza horizontalmente para recorrer el proceso completo →</div>
</div>

<section class="detail" id="detail" aria-live="polite">
  <!-- panel de detalle del paso activo, inyectado por JS -->
</section>

<footer class="controls">
  <div class="controls__progress">
    <div class="controls__labels">
      <span id="phaseLabel">Fase 1 · Solicitud de compra</span>
      <span id="stepLabel">Paso 1 de 28</span>
    </div>
    <div class="controls__bar"><div class="controls__bar-fill" id="barFill"></div></div>
  </div>
  <div class="controls__buttons">
    <button type="button" id="btnRestart" class="btn btn--ghost">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
      <span>Empezar de nuevo</span>
    </button>
    <div class="controls__nav">
      <button type="button" id="btnPrev" class="btn btn--outline">← Retroceder</button>
      <button type="button" id="btnNext" class="btn btn--solid">Avanzar →</button>
    </div>
  </div>
</footer>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal__close" id="modalClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
